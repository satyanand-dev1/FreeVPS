name: macOS-VNC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies & Setup ngrok
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
          MAC_USER_PASSWORD: ${{ secrets.MAC_USER_PASSWORD }}
          MAC_REALNAME: ${{ secrets.MAC_REALNAME }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          brew install ngrok/ngrok/ngrok
          ngrok config add-authtoken $NGROK_AUTH_TOKEN
          
          # Create admin user
          sudo dscl . -create /Users/vncuser
          sudo dscl . -create /Users/vncuser UserShell /bin/zsh
          sudo dscl . -create /Users/vncuser RealName "$MAC_REALNAME"
          sudo dscl . -create /Users/vncuser UniqueID "501"
          sudo dscl . -create /Users/vncuser PrimaryGroupID 20
          sudo dscl . -create /Users/vncuser NFSHomeDirectory /Users/vncuser
          sudo dscl . -passwd /Users/vncuser "$MAC_USER_PASSWORD"
          sudo dscl . -append /Groups/admin GroupMembership vncuser
          
          # Enable Screen Sharing (VNC)
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          
          # Start ngrok tunnel for VNC port 5900
          ngrok tcp 5900 &
          
          echo "=========================================="
          echo "macOS VNC Environment setup complete!"
          echo "Check your ngrok dashboard for the connection link."
          echo "=========================================="
          
      - name: Keep Alive
        run: sleep 21600
